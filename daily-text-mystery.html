<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Midnight at the Daily Text</title>
<style>
:root{
  /* Layout: one screen. Top case bar, a CSS-3D room you can look around, bottom room/tool bar. Single noir theme by choice. */
  --ink:#10151f;        /* night background */
  --panel:#1b2433;      /* bars and cards */
  --paper:#f3ead6;      /* clue paper */
  --paper-ink:#221c12;  /* text on paper */
  --lamp:#f2b441;       /* accent: desk-lamp amber */
  --line:#3a475c;       /* borders */
  --text:#eef1f6;       /* text on dark */
  --good:#3fae6a; --bad:#e2574c;
  --display:"Special Elite","Courier New",monospace;
  --body:"Atkinson Hyperlegible",Verdana,Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--ink);color:var(--text);font-family:var(--body);display:flex;flex-direction:column;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button{font-family:inherit;color:inherit;cursor:pointer;border:none;background:none}
button:focus-visible{outline:4px solid var(--lamp);outline-offset:3px}

/* bars */
#top,#bottom{background:var(--panel);display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}
#top{border-bottom:2px solid var(--line);justify-content:space-between}
#bottom{border-top:2px solid var(--line);justify-content:center}
#top h1{font-family:var(--display);font-weight:400;font-size:clamp(18px,2.2vw,34px);color:var(--lamp);letter-spacing:.5px}
.stats{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stat{background:var(--ink);border:2px solid var(--line);border-radius:10px;padding:6px 12px;font-size:clamp(15px,1.5vw,24px);font-variant-numeric:tabular-nums}
.stat b{color:var(--lamp)}
.btn{background:var(--ink);border:2px solid var(--line);border-radius:12px;padding:10px 16px;min-height:56px;font-size:clamp(15px,1.5vw,24px);font-weight:700}
.btn:hover{border-color:var(--lamp)}
.btn.room.on{background:var(--lamp);color:var(--paper-ink);border-color:var(--lamp)}
.btn.room small{display:block;font-weight:400;font-size:.75em;opacity:.85}
.btn.hot{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.go{background:var(--good);border-color:var(--good);color:#08210f}
.btn.look{font-size:clamp(22px,2.2vw,34px);min-width:64px}

/* 3D stage */
#stage{flex:1;position:relative;overflow:hidden;background:#07090d;min-height:0;touch-action:none}
#scaler{position:absolute;left:50%;top:50%;width:1000px;height:560px;perspective:900px;transform-origin:0 0}
#room{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateY(var(--a,0deg));transition:transform .25s ease-out;--a:0deg;pointer-events:none}
.wall{position:absolute;overflow:hidden;background:var(--wall)}
.wall.back{left:0;top:0;width:1000px;height:560px;transform:translateZ(-800px);background:
  linear-gradient(#0000 0 78%,#0004 78% 80%,var(--trim) 80%),var(--wallpat),var(--wall)}
.wall.left{left:0;top:0;width:800px;height:560px;transform-origin:left center;transform:rotateY(90deg);background:
  linear-gradient(#0000 0 78%,#0004 78% 80%,var(--trim) 80%),linear-gradient(90deg,#0005,#0000 60%),var(--wallpat),var(--wall)}
.wall.right{right:0;top:0;width:800px;height:560px;transform-origin:right center;transform:rotateY(-90deg);background:
  linear-gradient(#0000 0 78%,#0004 78% 80%,var(--trim) 80%),linear-gradient(270deg,#0005,#0000 60%),var(--wallpat),var(--wall)}
.wall.floor{left:0;bottom:0;width:1000px;height:800px;transform-origin:bottom center;transform:rotateX(90deg);background:var(--floorpat),var(--floor)}
.wall.ceil{left:0;top:0;width:1000px;height:800px;transform-origin:top center;transform:rotateX(-90deg);background:radial-gradient(circle at 50% 50%,#fff3 0,#0000 35%),var(--ceil)}
.sign{position:absolute;left:50%;top:26px;transform:translateX(-50%);background:var(--paper);color:var(--paper-ink);font-family:var(--display);font-size:44px;padding:10px 34px 4px;border:4px solid #0006;white-space:nowrap}
.decor{position:absolute;transform:translate(-50%,-50%);filter:saturate(.55) brightness(.75);pointer-events:none;line-height:1}
.obj{position:absolute;left:0;top:0;transform:translate3d(var(--x),var(--y),var(--z)) translate(-50%,-100%) rotateY(calc(var(--a,0deg) * -1));display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px;pointer-events:auto}
.obj .ico{font-size:var(--s);line-height:1;filter:drop-shadow(0 10px 8px #000a);animation:bob 2.4s ease-in-out infinite}
.obj .tag{background:var(--lamp);color:var(--paper-ink);font-weight:700;font-size:calc(var(--s) * .19);padding:3px 10px;border-radius:8px;white-space:nowrap}
.obj.done .ico{animation:none;filter:grayscale(.7) brightness(.7) drop-shadow(0 10px 8px #000a)}
.obj.done .tag{background:var(--good);color:#08210f}
@keyframes bob{50%{transform:translateY(-8px)}}
#hintbar{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:#000a;padding:6px 16px;border-radius:20px;font-size:clamp(14px,1.3vw,20px);pointer-events:none;white-space:nowrap}

/* modal */
#veil{position:fixed;inset:0;background:#05070bd9;display:none;align-items:center;justify-content:center;padding:16px;z-index:10}
#veil.on{display:flex}
#card{background:var(--paper);color:var(--paper-ink);width:min(1100px,100%);max-height:100%;overflow:auto;border-radius:14px;padding:clamp(18px,2.6vw,40px);display:flex;flex-direction:column;gap:clamp(12px,1.6vw,24px);box-shadow:0 20px 60px #000c;border:6px solid #c9b88f}
#card h2{font-family:var(--display);font-weight:400;font-size:clamp(24px,3vw,48px);text-wrap:balance}
#card h3{font-family:var(--display);font-weight:400;font-size:clamp(18px,1.9vw,30px)}
#card p,#card li{font-size:clamp(18px,2vw,32px);line-height:1.4}
#card .q{font-size:clamp(22px,2.6vw,42px);line-height:1.35;font-weight:700}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.opt{background:#fffaf0;border:3px solid #8d7a52;border-radius:12px;padding:16px;min-height:72px;font-size:clamp(20px,2.3vw,36px);font-weight:700;color:var(--paper-ink)}
.opt:hover{background:#ffe9b3}
.opt.no{background:#e9c9c4;border-color:var(--bad);text-decoration:line-through;opacity:.6;pointer-events:none}
.opt.yes{background:#bfe6cc;border-color:var(--good)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.pbtn{background:var(--paper-ink);color:var(--paper);border-radius:12px;padding:12px 22px;min-height:60px;font-size:clamp(18px,1.9vw,30px);font-weight:700}
.pbtn.alt{background:none;color:var(--paper-ink);border:3px solid var(--paper-ink)}
.pbtn.big{background:#a3271e;color:#fff}
.hook{background:#ffe9b3;border-left:8px solid var(--lamp);padding:10px 16px;font-size:clamp(18px,2vw,30px)}
.clue{background:#fffaf0;border:3px dashed #8d7a52;padding:16px 20px;border-radius:10px}
.stamp{font-family:var(--display);color:#a3271e;border:4px solid #a3271e;display:inline-block;padding:6px 14px 0;transform:rotate(-3deg);font-size:clamp(20px,2.2vw,34px);align-self:flex-start}
.cols{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.cols ul{list-style:none;display:flex;flex-direction:column;gap:6px}
.cols li.x{text-decoration:line-through;opacity:.45}
.chip{background:#fffaf0;border:3px solid #8d7a52;border-radius:12px;padding:10px 14px;min-height:56px;font-size:clamp(17px,1.8vw,28px);font-weight:700;color:var(--paper-ink);text-align:left}
.chip.sel{background:var(--paper-ink);color:var(--paper);border-color:var(--paper-ink)}
.chips{display:flex;flex-direction:column;gap:8px}
.tiles{display:flex;gap:8px;flex-wrap:wrap;min-height:76px;align-items:center}
.tile{width:clamp(48px,5.4vw,84px);height:clamp(56px,6vw,92px);background:var(--paper-ink);color:var(--lamp);font-family:var(--display);font-size:clamp(28px,3.4vw,54px);border-radius:10px;display:flex;align-items:center;justify-content:center;padding-top:6px}
.tile.slot{background:none;border:3px dashed #8d7a52;color:var(--paper-ink)}
.log{display:flex;flex-direction:column;gap:8px}
.log p{font-size:clamp(16px,1.6vw,24px)}
.msg{font-weight:700;font-size:clamp(18px,2vw,30px)}
.msg.bad{color:#a3271e}.msg.good{color:#1c6b3a}
#teams{background:var(--panel);display:flex;gap:8px;padding:8px 16px;flex-wrap:wrap;justify-content:center;border-bottom:2px solid var(--line)}
#teams:empty{display:none}
.team{background:var(--ink);border:2px solid var(--line);border-radius:10px;padding:6px 14px;min-height:48px;font-size:clamp(15px,1.5vw,24px);font-weight:700;font-variant-numeric:tabular-nums}
.team b{color:var(--lamp)}
.team.turn{background:var(--lamp);color:var(--paper-ink);border-color:var(--lamp)}
.team.turn b{color:var(--paper-ink)}
.opts.locked .opt{opacity:.4;pointer-events:none}
.chip.given,.chip.sel.given{background:#bfe6cc;border-color:var(--good);color:var(--paper-ink)}
.bonus{display:flex;gap:8px;flex-wrap:wrap}
.bonus .chip{text-align:center}
.srow{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.srow .num{min-width:2.5em;text-align:center;font-weight:700;font-size:clamp(22px,2.4vw,38px);font-variant-numeric:tabular-nums}
.btn.locked{opacity:.6}
@media (max-width:640px){.opts,.cols{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.obj .ico{animation:none}#room{transition:none}}
</style>
</head>
<body>
<header id="top">
  <h1>Midnight at the Daily Text</h1>
  <div class="stats">
    <span class="stat">Question time <b id="time">00:00</b></span>
    <span class="stat">Clues <b id="count">0/25</b></span>
    <span class="stat">Mistakes <b id="wrong">0</b></span>
    <button class="btn" id="mute" aria-pressed="false">Sound on</button>
    <button class="btn" id="restart">Restart</button>
  </div>
</header>
<div id="teams"></div>
<main id="stage" aria-label="3D room. Drag to look around. Tap objects to investigate.">
  <div id="scaler"><div id="room"></div></div>
  <div id="hintbar">Tap an object to investigate. Drag or use the arrows to look around.</div>
</main>
<nav id="bottom">
  <button class="btn look" id="lookL" aria-label="Look left">◀</button>
  <span id="rooms" class="row"></span>
  <button class="btn look" id="lookR" aria-label="Look right">▶</button>
  <button class="btn" id="nb">Notebook</button>
  <button class="btn hot" id="acc">Accuse</button>
  <button class="btn go" id="exit" hidden>Exit door</button>
</nav>
<div id="veil" role="dialog" aria-modal="true"><div id="card"></div></div>

<script>
"use strict";
const SUSPECTS=[["Bianca Bias","newspaper columnist"],["Dr. Jules Jargon","science writer"],["Sara Casm","comedy critic"],["Addie Vert","advertising manager"],["Doc Mentary","film director"],["Otto Biography","memoir writer"]];
const WEAPONS=["Heavy Dictionary","Cup of Tea","Golden Trophy","Camera Tripod","Stapler","Poster Tube"];

const ANSWER={s:"Addie Vert",w:"Golden Trophy",p:"Archive"};
const PASSWORD="NONFICTION";

const ROOMS=[
 {name:"Newsroom",wall:"#3d4d61",trim:"#27323f",floor:"#2a2f36",ceil:"#1c222b",
  wallpat:"repeating-linear-gradient(90deg,#0000 0 78px,#0002 78px 80px)",
  floorpat:"repeating-conic-gradient(#0003 0 25%,#fff1 0 50%) 0 0/100px 100px",
  decor:[["back",14,45,"🕛",90],["back",86,45,"📰",90],["left",45,40,"🪟",190],["right",55,42,"🗄️",190]]},
 {name:"Library",wall:"#2f4c3d",trim:"#4a3320",floor:"#5b3f26",ceil:"#1b261f",
  wallpat:"repeating-linear-gradient(0deg,#0000 0 108px,#0003 108px 112px)",
  floorpat:"repeating-linear-gradient(90deg,#0000 0 96px,#0004 96px 100px)",
  decor:[["back",12,48,"📚",110],["back",88,48,"📚",110],["left",30,45,"📚",170],["left",70,45,"📚",170],["right",30,45,"📚",170],["right",70,45,"🪜",170]]},
 {name:"Film Studio",wall:"#3b3454",trim:"#211d30",floor:"#1e1c24",ceil:"#14121b",
  wallpat:"repeating-linear-gradient(90deg,#0000 0 148px,#fff1 148px 150px)",

  decor:[["back",13,45,"💡",100],["back",87,45,"🎞️",100],["left",50,42,"🎭",190],["right",50,42,"🪞",190]]},
 {name:"Ad Office",wall:"#6a4038",trim:"#3d2520",floor:"#3a3a40",ceil:"#231816",
  wallpat:"repeating-linear-gradient(0deg,#0000 0 38px,#0002 38px 40px),repeating-linear-gradient(90deg,#0000 0 78px,#0002 78px 80px)",

 {name:"Archive",wall:"#4d4838",trim:"#2c2920",floor:"#2f2c25",ceil:"#1a1814",

];
// positions: [x, y(bottom), z, size]
const POS=[[190,548,-230,118],[320,395,-770,160],[665,395,-770,160],[835,548,-300,122],[510,552,-520,138]];

// kind: S suspect, W weapon, P place, L letter. opts[0] is correct (shuffled on screen).
const PUZ=[
 // Newsroom
 {id:"news",r:0,ico:"🗞️",obj:"Newspaper",term:"(News) article",hook:"Today's events",

  opts:["News article","Autobiography","Advertisement","Fiction"],kind:"P",val:"Newsroom",

  q:"“My uncle tried it once, and it worked for him.” This proof comes from one person's experience. It is not scientific. What is it?",
  opts:["Anecdotal evidence","Statistical evidence","Expert opinion","Nonfiction"],kind:"W",val:"Stapler",
  clue:"The guard says: “In my experience, staplers are dangerous.” That is only anecdotal evidence. Look closer: the stapler is still inside its closed box. The Stapler is not the weapon."},
 {id:"sarc",r:4,ico:"💬",obj:"Sara's note",term:"Sarcasm",hook:"Mocking irony",
  q:"It is raining hard. Someone says: “Oh, GREAT. What a beautiful day.” The speaker means the opposite, to mock. What is this?",
  opts:["Sarcasm","Jargon","Bias","Description"],kind:"S",val:"Sara Casm",
  clue:"Sara's note: “Oh, WONDERFUL. I just LOVE working late.” That is sarcasm. She was not working late. She was on a live TV comedy show at 11:30. Sara Casm is innocent."},
 {id:"cause",r:4,ico:"🔌",obj:"Power switch",term:"Cause and effect",hook:"Domino effect",
  q:"“The power went out, so the elevator stopped.” One event makes another event happen. What is this?",
  opts:["Cause and effect","Compare and contrast","Question and answer","Chronological order"],kind:"P",val:"Elevator",
  clue:"The power went out at 11:00, so the elevator stopped between floors. Because it was stuck, nobody could get in. The crime did not happen in the Elevator."},
 {id:"comp",r:4,ico:"🏆",obj:"Two trophies",term:"Compare and contrast",hook:"Same, different",
  q:"The writer shows how two things are similar and how they are different. What is this?",
  opts:["Compare and contrast","Cause and effect","Problem and solution","Pro and con argument"],kind:"L",val:"I",
  clue:"Compare the two trophies. Both are gold. Both say “Best Advertisement.” But one is clean, and the other has a fresh dent. A letter tile is inside the clean one."},
 {id:"prob",r:4,ico:"🔐",obj:"Locked exit",term:"Problem and solution",hook:"Fix it",
  q:"“The door is locked. To fix this, we find the password.” The writer shows a problem and then a way to fix it. What is this?",
  opts:["Problem and solution","Question and answer","Pro and con argument","Sarcasm"],kind:"L",val:"N",
  clue:"Problem: the exit door is locked. Solution: put your 10 letter tiles in order to spell the password. Here is the last tile."}
];

const KEY="daily-text-mystery-v1";
const fresh=()=>({solved:[],wrong:0,elapsed:0,started:false,accused:false,escaped:false,room:0,mute:false,groups:0,scores:[],turn:0,tries:{}});
let S=fresh();
try{const t=JSON.parse(localStorage.getItem(KEY));if(t&&Array.isArray(t.solved))S=Object.assign(fresh(),t);}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}};
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const isDone=id=>S.solved.includes(id);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};

/* sound */
let actx=null;
function beep(kind){
  if(S.mute)return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const seq={good:[523,659,784],bad:[196,156],win:[523,659,784,1047,1319],tap:[440]}[kind];
    seq.forEach((f,i)=>{const o=actx.createOscillator(),g=actx.createGain();o.type=kind==="bad"?"sawtooth":"triangle";o.frequency.value=f;
      const t=actx.currentTime+i*0.11;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.18,t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+0.2);
      o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+0.22);});
  }catch(e){}
}

/* 3D room */
let angle=0;
function setAngle(a){angle=Math.max(-24,Math.min(24,a));$("room").style.setProperty("--a",angle+"deg");}
function fit(){
  const st=$("stage"),s=Math.min(st.clientWidth/1000,st.clientHeight/560);
  $("scaler").style.transform="scale("+s+") translate(-50%,-50%)";
}
function drawRoom(){
  const R=ROOMS[S.room],room=$("room");
  room.style.setProperty("--wall",R.wall);room.style.setProperty("--trim",R.trim);room.style.setProperty("--floor",R.floor);
  room.style.setProperty("--ceil",R.ceil);room.style.setProperty("--wallpat",R.wallpat);room.style.setProperty("--floorpat",R.floorpat);
  const dec=w=>R.decor.filter(d=>d[0]===w).map(d=>'<span class="decor" style="left:'+d[1]+'%;top:'+d[2]+'%;font-size:'+d[4]+'px">'+d[3]+'</span>').join("");
  let h='<div class="wall floor"></div><div class="wall ceil"></div>'+
    '<div class="wall back"><div class="sign">'+esc(R.name.toUpperCase())+'</div>'+dec("back")+'</div>'+
    '<div class="wall left">'+dec("left")+'</div><div class="wall right">'+dec("right")+'</div>';
  PUZ.filter(p=>p.r===S.room).forEach((p,i)=>{const P=POS[i];
    h+='<button class="obj'+(isDone(p.id)?" done":"")+'" data-id="'+p.id+'" style="--x:'+P[0]+'px;--y:'+P[1]+'px;--z:'+P[2]+'px;--s:'+P[3]+'px">'+
       '<span class="ico">'+p.ico+'</span><span class="tag">'+(isDone(p.id)?"✔ ":"")+esc(p.obj)+'</span></button>';});
  room.innerHTML=h;
  setAngle(0);
}
function drawBars(){
  $("rooms").innerHTML=ROOMS.map((R,i)=>{const n=PUZ.filter(p=>p.r===i&&isDone(p.id)).length;
    return '<button class="btn room'+(i===S.room?" on":"")+'" data-room="'+i+'">'+esc(R.name)+'<small>'+n+'/5 clues</small></button>';}).join("");
  $("count").textContent=S.solved.length+"/25";
  $("wrong").textContent=S.wrong;
  $("exit").hidden=!S.accused;
  $("acc").hidden=S.accused;
  const left=25-S.solved.length;
  $("acc").textContent=left>0?"Accuse (locked)":"Accuse";
  $("acc").classList.toggle("hot",left===0);$("acc").classList.toggle("locked",left>0);
  $("teams").innerHTML=S.groups?S.scores.map((v,i)=>'<button class="team'+(i===S.turn&&!S.escaped?" turn":"")+'" data-team="'+i+'">'+(i===S.turn&&!S.escaped?"▶ ":"")+'Group '+(i+1)+' <b>'+v+'</b></button>').join(""):"";
  fit();
  $("mute").textContent=S.mute?"Sound off":"Sound on";
  $("mute").setAttribute("aria-pressed",S.mute);
  drawTime();
}
function drawTime(){const m=Math.floor(S.elapsed/60),s=S.elapsed%60;$("time").textContent=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0");}
let qOpen=false;
setInterval(()=>{if(qOpen&&!S.escaped){S.elapsed++;drawTime();if(S.elapsed%5===0)save();}},1000);

/* modal helpers */
function show(html){qOpen=false;$("card").innerHTML=html;$("veil").classList.add("on");$("card").scrollTop=0;const b=$("card").querySelector("button");if(b)b.focus({preventScroll:true});}
function hide(){qOpen=false;$("veil").classList.remove("on");}
const closeBtn=(t)=>'<button class="pbtn" data-act="close">'+(t||"Back to the room")+'</button>';

function rewardText(p){
  if(p.kind==="L")return "You found a letter tile:";
  return {S:"Cross out a suspect:",W:"Cross out a weapon:",P:"Cross out a place:"}[p.kind];
}
let given=new Set();
function bonusRow(title,pts,exclude){
  if(!S.groups)return "";
  given=new Set();
  return '<h3>'+title+'</h3><div class="bonus">'+S.scores.map((v,i)=>i===exclude?"":'<button class="chip" data-bonus="'+i+'" data-pts="'+pts+'">Group '+(i+1)+' +'+pts+'</button>').join("")+'</div>';
}
function clueHTML(p,isNew,info){
  return '<span class="stamp">'+(isNew?"CLUE FOUND":"CLUE")+'</span>'+
    '<h2>'+esc(p.obj)+'</h2>'+
    '<p class="hook"><b>'+esc(p.term)+'</b> = '+esc(p.hook)+'</p>'+
    '<div class="clue"><p>'+esc(p.clue)+'</p></div>'+
    '<div class="row"><h3>'+rewardText(p)+'</h3>'+(p.kind==="L"?'<span class="tile">'+p.val+'</span>':'<p><b><s>'+esc(p.val)+'</s></b></p>')+'</div>'+
    (info?'<p class="msg good">Group '+(info.g+1)+' at the board: +'+info.pts+(info.pts===1?" point":" points")+'</p>'+bonusRow("Seated groups with the correct answer on paper:",1,info.g):"")+
    '<div class="row">'+closeBtn()+'</div>';
}
let cur=null;
function openPuzzle(id){
  const p=PUZ.find(x=>x.id===id);cur=p;
  if(isDone(id)){show(clueHTML(p,false));return;}
  beep("tap");
  const lock=S.groups>0;
  show('<h3>'+esc(ROOMS[p.r].name)+' · '+esc(p.obj)+' '+p.ico+(lock?' · Group '+(S.turn+1)+' at the board':'')+'</h3>'+
    '<p class="q">'+esc(p.q)+'</p>'+
    (lock?'<div class="row" id="lockrow"><button class="pbtn big" data-act="unlockOpts">Open answers</button><p>All groups: write your answer on your sheet first.</p></div>':'')+
    '<div class="opts'+(lock?' locked':'')+'" id="opts">'+shuffle(p.opts).map(o=>'<button class="opt" data-opt="'+esc(o)+'">'+esc(o)+'</button>').join("")+'</div>'+
    '<p class="msg" id="fb" aria-live="polite"></p>'+
    '<div class="row"><button class="pbtn alt" data-act="hint">Hint</button><button class="pbtn alt" data-act="close">Leave it</button></div>');
  qOpen=true;
}
function answer(btn){
  const p=cur;if(!p)return;
  if(btn.dataset.opt===p.opts[0]){
    btn.classList.add("yes");S.solved.push(p.id);qOpen=false;
    let info=null;
    if(S.groups){const t=S.tries[p.id]||0,pts=t===0?2:t===1?1:0;info={g:S.turn,pts:pts};S.scores[S.turn]+=pts;S.turn=(S.turn+1)%S.groups;}
    save();beep("good");
    drawRoom();drawBars();
    setTimeout(()=>show(clueHTML(p,true,info)),450);
  }else{
    btn.classList.add("no");S.wrong++;S.tries[p.id]=(S.tries[p.id]||0)+1;save();beep("bad");drawBars();
    const fb=$("fb");fb.className="msg bad";fb.textContent="Not this one. Read the clue words again and try another answer.";
  }
}

function notebook(){
  const out=k=>PUZ.filter(p=>p.kind===k&&isDone(p.id)).map(p=>p.val);
  const xs=out("S"),xw=out("W"),xp=out("P"),letters=PUZ.filter(p=>p.kind==="L"&&isDone(p.id)).map(p=>p.val);
  const li=(name,x,sub)=>'<li class="'+(x?"x":"")+'">'+esc(name)+(sub?' <small>('+esc(sub)+')</small>':"")+'</li>';
  const log=PUZ.filter(p=>isDone(p.id)).map(p=>'<p><b>'+esc(p.term)+':</b> '+esc(p.clue)+'</p>').join("")||"<p>No clues yet. Tap objects in the rooms.</p>";
  show('<h2>Detective Notebook</h2>'+
    '<div class="cols"><div><h3>Suspects</h3><ul>'+SUSPECTS.map(s=>li(s[0],xs.includes(s[0]),s[1])).join("")+'</ul></div>'+
    '<div><h3>Weapons</h3><ul>'+WEAPONS.map(w=>li(w,xw.includes(w))).join("")+'</ul></div>'+
    '<div><h3>Places</h3><ul>'+PLACES.map(p=>li(p,xp.includes(p))).join("")+'</ul></div></div>'+
    '<h3>Letter tiles: '+letters.length+' of 10</h3><div class="tiles">'+(letters.map(l=>'<span class="tile">'+l+'</span>').join("")||"<p>None yet.</p>")+'</div>'+
    '<div class="row">'+closeBtn()+'</div>'+
    '<h3>Clue log</h3><div class="log">'+log+'</div>');
}

let pick={s:null,w:null,p:null};
function accuse(msg){
  const left=25-S.solved.length;
  if(left>0){show('<h2>The police chief is not ready</h2><p>You need all 25 clues before you can accuse anyone. Clues left to find: <b>'+left+'</b>.</p><p>Look for objects without a green check.</p><div class="row">'+closeBtn("Keep searching")+'</div>');return;}
  const grp=(k,title,arr)=>'<div><h3>'+title+'</h3><div class="chips">'+arr.map(v=>'<button class="chip'+(pick[k]===v?" sel":"")+'" data-pick="'+k+'" data-val="'+esc(v)+'">'+esc(v)+'</button>').join("")+'</div></div>';
  show('<h2>Make your accusation</h2><p>Choose one suspect, one weapon and one place. Use your notebook first!</p>'+
    '<div class="cols">'+grp("s","Who?",SUSPECTS.map(s=>s[0]))+grp("w","With what?",WEAPONS)+grp("p","Where?",PLACES)+'</div>'+
    '<p class="msg bad" aria-live="polite">'+(msg||"")+'</p>'+
    '<div class="row"><button class="pbtn big" data-act="accuse">Accuse!</button><button class="pbtn alt" data-act="notebook">Notebook</button><button class="pbtn alt" data-act="close">Keep searching</button></div>');
}
function doAccuse(){
  if(!pick.s||!pick.w||!pick.p){accuse("Choose all three: who, with what, and where.");return;}
  if(pick.s===ANSWER.s&&pick.w===ANSWER.w&&pick.p===ANSWER.p){
    S.accused=true;save();beep("win");drawBars();
    show('<span class="stamp">CASE SOLVED</span><h2>It was Addie Vert, with the Golden Trophy, in the Archive!</h2>'+
      '<p>Addie wanted to print a dishonest advertisement for Miracle Tea. Max said no. At 11:30 they argued in the Archive, and Addie hit him with her “Best Advertisement” trophy.</p>'+
      '<p>The police are coming. But the exit door is still locked. You need the password.</p>'+
      bonusRow("Groups that wrote the correct accusation on paper:",3,-1)+
      '<div class="row"><button class="pbtn big" data-act="exit">Go to the exit door</button></div>');
  }else{
    S.wrong++;save();beep("bad");drawBars();
    accuse("The police chief says no. One or more parts are wrong. Find more clues and check your notebook.");
  }
}

let build=[];// indexes into letters
function exitDoor(msg,good){
  const letters=PUZ.filter(p=>p.kind==="L"&&isDone(p.id)).map(p=>p.val);
  if(letters.length<10){
    show('<h2>The exit door is locked</h2><p>The password has 10 letters. You have '+letters.length+' letter tiles.</p>'+
      '<div class="tiles">'+letters.map(l=>'<span class="tile">'+l+'</span>').join("")+'</div>'+
      '<p>Find the missing tiles. Look for objects without a green check.</p><div class="row">'+closeBtn("Keep searching")+'</div>');
    return;
  }
  build=build.filter(i=>i<letters.length);
  let slots="";for(let i=0;i<10;i++){slots+= i<build.length?'<button class="tile" data-back="'+i+'" aria-label="Remove letter '+letters[build[i]]+'">'+letters[build[i]]+'</button>':'<span class="tile slot"></span>';}
  const pool=letters.map((l,i)=>build.includes(i)?"":'<button class="tile" data-add="'+i+'">'+l+'</button>').join("");
  show('<h2>Unlock the exit door</h2><p>Tap the tiles to spell the password. It is a Unit 4 word. Memory hook: <b>Real facts</b>.</p>'+
    '<h3>Password</h3><div class="tiles">'+slots+'</div>'+
    '<h3>Your tiles</h3><div class="tiles">'+pool+'</div>'+
    '<p class="msg '+(good?"good":"bad")+'" aria-live="polite">'+(msg||"")+'</p>'+
    '<div class="row"><button class="pbtn big" data-act="unlock">Unlock</button><button class="pbtn alt" data-act="clear">Clear</button><button class="pbtn alt" data-act="close">Back to the room</button></div>');
}
function unlock(){
  const letters=PUZ.filter(p=>p.kind==="L"&&isDone(p.id)).map(p=>p.val);
  const word=build.map(i=>letters[i]).join("");
  if(word===PASSWORD){
    S.escaped=true;save();beep("win");drawBars();
    const m=Math.floor(S.elapsed/60),s=S.elapsed%60;
    const rank=S.wrong<=3?"Chief Detective":S.wrong<=8?"Senior Detective":"Junior Detective";
    show('<span class="stamp">YOU ESCAPED</span><h2>The door opens. Case closed!</h2>'+
      '<p>Question time: <b>'+m+' min '+s+' s</b> · Mistakes: <b>'+S.wrong+'</b> · Clues: <b>'+S.solved.length+'/25</b></p>'+
      '<p>Class rank: <b>'+rank+'</b></p>'+
      bonusRow("First group to unscramble the password:",3,-1)+
      '<div class="row">'+(S.groups?'<button class="pbtn big" data-act="scores">Final scores</button>':'')+'<button class="pbtn" data-act="notebook">Read the clue log</button><button class="pbtn alt" data-act="restartYes">Play again</button></div>');
  }else{
    S.wrong++;save();beep("bad");drawBars();
    exitDoor(word.length<10?"Use all 10 tiles.":"That is not the password. Try another order.");
  }
}

let setupN=6;
function intro(){
  const pickN=S.started?"":'<h3>How many groups are playing?</h3><div class="bonus">'+[2,3,4,5,6,7,8,9,10].map(n=>'<button class="chip'+(setupN===n?" sel":"")+'" data-n="'+n+'">'+n+'</button>').join("")+'<button class="chip'+(setupN===0?" sel":"")+'" data-n="0">No teams</button></div>';
  show('<span class="stamp">CASE FILE · UNIT 4</span><h2>Midnight at the Daily Text</h2>'+
    '<p>It is midnight at the Daily Text newspaper. The editor, Max Headline, is dead. The doors are locked. Nobody leaves until the case is solved.</p>'+
    '<ol style="padding-left:1.2em"><li>Groups take turns. Tap an object in a room.</li><li>Every group writes an answer. Then the board group taps.</li><li>Clues cross out suspects, weapons and places, or give letter tiles.</li><li>Find all 25 clues. Accuse the killer. Spell the password to escape.</li></ol>'+
    pickN+
    '<div class="row"><button class="pbtn big" data-act="start">'+(S.started?"Continue the case":"Start the case")+'</button>'+(S.started?'<button class="pbtn alt" data-act="restartYes">Start a new game</button>':"")+'</div>');
}
function scores(){
  if(!S.groups){hide();return;}
  const top=Math.max.apply(null,S.scores);
  show('<h2>Scores</h2>'+S.scores.map((v,i)=>'<div class="srow"><h3 style="min-width:7em">'+(v===top&&top>0?"★ ":"")+'Group '+(i+1)+'</h3><button class="pbtn alt" data-sc="'+i+'" data-d="-1" aria-label="Minus one">−</button><span class="num">'+v+'</span><button class="pbtn alt" data-sc="'+i+'" data-d="1" aria-label="Plus one">+</button>'+(S.escaped?"":(i===S.turn?'<p><b>At the board now</b></p>':'<button class="pbtn alt" data-turn="'+i+'">Make it their turn</button>'))+'</div>').join("")+
    '<div class="row">'+closeBtn()+'</div>');
}
function confirmRestart(){
  show('<h2>Restart the game?</h2><p>All clues, time and mistakes will be erased.</p><div class="row"><button class="pbtn big" data-act="restartYes">Yes, restart</button><button class="pbtn alt" data-act="close">No, keep playing</button></div>');
}

/* events */
$("card").addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.opt!==undefined){answer(b);return;}
  if(b.dataset.bonus!==undefined){const i=+b.dataset.bonus,pts=+b.dataset.pts;if(given.has(i)){given.delete(i);S.scores[i]-=pts;b.classList.remove("given");}else{given.add(i);S.scores[i]+=pts;b.classList.add("given");}save();drawBars();beep("tap");return;}
  if(b.dataset.n!==undefined){setupN=+b.dataset.n;intro();return;}
  if(b.dataset.sc!==undefined){S.scores[+b.dataset.sc]+= +b.dataset.d;save();drawBars();scores();return;}
  if(b.dataset.turn!==undefined){S.turn=+b.dataset.turn;save();drawBars();scores();return;}
  if(b.dataset.pick){pick[b.dataset.pick]=b.dataset.val;beep("tap");accuse();return;}
  if(b.dataset.add!==undefined){if(build.length<10)build.push(+b.dataset.add);beep("tap");exitDoor();return;}
  if(b.dataset.back!==undefined){build.splice(+b.dataset.back,1);exitDoor();return;}
  switch(b.dataset.act){
    case "close":hide();break;
    case "hint":{const fb=$("fb");fb.className="msg good";fb.textContent="Memory hook: “"+cur.hook+"”";break;}
    case "start":if(!S.started){S.groups=setupN;S.scores=Array(setupN).fill(0);S.turn=0;}S.started=true;save();drawBars();hide();beep("tap");break;
    case "unlockOpts":{$("opts").classList.remove("locked");const l=$("lockrow");if(l)l.remove();break;}
    case "scores":scores();break;
    case "notebook":notebook();break;
    case "accuse":doAccuse();break;
    case "exit":exitDoor();break;
    case "unlock":unlock();break;
    case "clear":build=[];exitDoor();break;
    case "restartYes":{const m=S.mute;S=fresh();S.mute=m;pick={s:null,w:null,p:null};build=[];save();drawRoom();drawBars();intro();break;}
  }
});
$("rooms").addEventListener("click",e=>{const b=e.target.closest("[data-room]");if(!b)return;S.room=+b.dataset.room;save();beep("tap");drawRoom();drawBars();});
$("nb").onclick=notebook;
$("teams").addEventListener("click",e=>{if(e.target.closest("[data-team]"))scores();});
$("acc").onclick=()=>accuse();
$("exit").onclick=()=>exitDoor();
$("restart").onclick=confirmRestart;
$("mute").onclick=()=>{S.mute=!S.mute;save();drawBars();};
$("lookL").onclick=()=>setAngle(angle-12);
$("lookR").onclick=()=>setAngle(angle+12);
document.addEventListener("keydown",e=>{if($("veil").classList.contains("on"))return;if(e.key==="ArrowLeft")setAngle(angle-12);if(e.key==="ArrowRight")setAngle(angle+12);});

/* drag to look, tap to open */
let drag=null;
const stage=$("stage");
stage.addEventListener("pointerdown",e=>{drag={x:e.clientX,a:angle,moved:false,id:(e.target.closest(".obj")||{}).dataset?e.target.closest(".obj").dataset.id:null};});
stage.addEventListener("pointermove",e=>{if(!drag)return;const dx=e.clientX-drag.x;if(Math.abs(dx)>10){drag.moved=true;$("room").style.transition="none";setAngle(drag.a-dx*0.06);}});
const endDrag=e=>{if(!drag)return;$("room").style.transition="";const d=drag;drag=null;if(!d.moved&&d.id){const o=e.target.closest&&e.target.closest(".obj");if(o&&o.dataset.id===d.id)openPuzzle(d.id);}};
stage.addEventListener("pointerup",endDrag);
stage.addEventListener("pointercancel",()=>{drag=null;$("room").style.transition="";});
stage.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.classList.contains("obj")){e.preventDefault();openPuzzle(e.target.dataset.id);}});

window.addEventListener("resize",fit);
drawRoom();drawBars();fit();
if(S.escaped){S=Object.assign(fresh(),{mute:S.mute});save();drawRoom();drawBars();}
intro();
</script>
</body>
</html>
