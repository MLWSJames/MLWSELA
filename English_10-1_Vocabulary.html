<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English 10-1 Vocabulary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EFE7D8;
    --paper-line:#D9CFB8;
    --card:#FFFDF8;
    --ink:#22303F;
    --ink-soft:#5B6B74;
    --green:#3B6255;
    --green-dark:#26443A;
    --green-tint:#E4EBE6;
    --rust:#BE5A2A;
    --rust-tint:#F5E4D8;
    --gold:#C8932B;
    --gold-tint:#F6EAD1;
    --radius:14px;
    --shadow: 0 1px 0 rgba(34,48,63,.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    background-image:
      linear-gradient(var(--paper-line) 1px, transparent 1px);
    background-size: 100% 42px;
    color:var(--ink);
    font-family:'Atkinson Hyperlegible', sans-serif;
    font-size:17px;
    line-height:1.5;
    min-height:100vh;
  }
  h1,h2,h3,.serif{font-family:'Source Serif 4', serif;}
  button{font-family:inherit;}
  .app{max-width:1080px;margin:0 auto;padding:28px 20px 60px;}

  /* ---------- Header ---------- */
  .masthead{
    display:flex; align-items:baseline; justify-content:space-between;
    flex-wrap:wrap; gap:10px 24px;
    border-bottom:2px solid var(--ink);
    padding-bottom:14px; margin-bottom:22px;
  }
  .masthead h1{
    font-size:clamp(28px,4.4vw,40px);
    font-weight:700; margin:0; letter-spacing:.2px; color:var(--green-dark);
  }
  .masthead .tag{
    color:var(--ink-soft); font-size:14.5px; max-width:360px;
  }

  /* ---------- Mode tabs (catalog drawer look) ---------- */
  .drawer{
    display:flex; gap:6px; flex-wrap:wrap; margin-bottom:22px;
  }
  .drawer button{
    background:var(--card);
    border:1.5px solid var(--ink);
    border-bottom-width:4px;
    border-radius:8px 8px 4px 4px;
    padding:9px 15px;
    font-size:14.5px; font-weight:700;
    color:var(--ink);
    cursor:pointer;
    transition:transform .12s ease;
  }
  .drawer button:hover{transform:translateY(-1px);}
  .drawer button.active{
    background:var(--green); color:#fff; border-color:var(--green-dark);
  }
  .list-drawer{margin-bottom:10px;}
  .list-drawer .drawer-label{
    font-size:12.5px; font-weight:700; text-transform:uppercase; letter-spacing:.6px;
    color:var(--ink-soft); margin-right:4px; align-self:center;
  }
  .list-drawer button.active{
    background:var(--rust); color:#fff; border-color:#8a3f18;
  }

  /* ---------- Layout: sidebar + stage ---------- */
  .layout{display:grid; grid-template-columns:250px 1fr; gap:22px;}
  @media (max-width:760px){ .layout{grid-template-columns:1fr;} }

  .sidebar{
    background:var(--card); border:1px solid var(--paper-line);
    border-radius:var(--radius); padding:14px; height:fit-content;
  }
  .sidebar input[type=search]{
    width:100%; padding:9px 10px; border-radius:8px;
    border:1.5px solid var(--paper-line); font-size:14.5px;
    font-family:inherit; margin-bottom:10px; background:#fff;
  }
  .pos-filter{display:flex; flex-wrap:wrap; gap:5px; margin-bottom:12px;}
  .pos-chip{
    font-size:12px; font-weight:700; padding:4px 9px; border-radius:99px;
    border:1.5px solid var(--paper-line); cursor:pointer; background:#fff; color:var(--ink-soft);
  }
  .pos-chip.on{background:var(--green); border-color:var(--green-dark); color:#fff;}
  .word-list{list-style:none; margin:0; padding:0; max-height:520px; overflow-y:auto;}
  .word-list li button{
    width:100%; text-align:left; background:none; border:none; cursor:pointer;
    padding:8px 8px; border-radius:8px; font-size:15px; color:var(--ink);
    display:flex; justify-content:space-between; gap:8px; align-items:center;
  }
  .word-list li button:hover{background:var(--green-tint);}
  .word-list li button.current{background:var(--green); color:#fff;}
  .word-list .num{color:var(--ink-soft); font-size:12px; font-variant-numeric:tabular-nums;}
  .word-list li button.current .num{color:#dfe9e4;}

  .stage{min-height:520px;}

  /* ---------- Specimen Card ---------- */
  .specimen{
    background:var(--card); border:1px solid var(--paper-line);
    border-radius:var(--radius); overflow:hidden;
  }
  .specimen-tab{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--green); color:#fff; padding:12px 20px;
  }
  .specimen-tab .cat-num{font-family:'Source Serif 4',serif; font-weight:700; letter-spacing:.5px; opacity:.85;}
  .pos-badge{
    display:inline-block; font-size:12px; font-weight:700; text-transform:lowercase;
    padding:3px 10px; border-radius:99px; background:rgba(255,255,255,.18);
  }
  .specimen-body{padding:22px 24px 26px;}
  .specimen-word{
    font-size:clamp(26px,4vw,34px); font-weight:700; color:var(--green-dark); margin:0 0 4px;
  }
  .specimen-def{font-size:18px; margin:0 0 20px; color:var(--ink);}
  .quad{
    display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-bottom:18px;
  }
  @media (max-width:520px){ .quad{grid-template-columns:1fr;} }
  .quad-box{
    border:1.5px solid var(--paper-line); border-radius:10px; padding:12px 14px; background:#fff;
  }
  .quad-box h4{
    margin:0 0 8px; font-size:12.5px; text-transform:uppercase; letter-spacing:.6px;
    color:var(--ink-soft); font-family:'Atkinson Hyperlegible',sans-serif; font-weight:700;
  }
  .pillrow{display:flex; flex-wrap:wrap; gap:6px;}
  .pill{
    font-size:13.5px; padding:4px 10px; border-radius:99px;
  }
  .pill.syn{background:var(--green-tint); color:var(--green-dark);}
  .pill.ant{background:var(--rust-tint); color:var(--rust);}
  .empty-pill{color:var(--ink-soft); font-size:13.5px; font-style:italic;}

  .family-table{width:100%; border-collapse:collapse; font-size:14.5px; margin-bottom:18px;}
  .family-table th{
    text-align:left; font-size:12px; text-transform:uppercase; letter-spacing:.5px;
    color:var(--ink-soft); border-bottom:1.5px solid var(--paper-line); padding:6px 8px;
  }
  .family-table td{padding:7px 8px; border-bottom:1px solid var(--paper-line); vertical-align:top;}

  .sketch-block{border-top:1.5px dashed var(--paper-line); padding-top:16px;}
  .sketch-block h4{margin:0 0 8px; font-size:14px; color:var(--ink-soft); font-weight:700;}
  .sketch-wrap{
    display:flex; gap:14px; flex-wrap:wrap; align-items:flex-start;
  }
  canvas.pad{
    background:#fff; border:1.5px solid var(--paper-line); border-radius:10px;
    touch-action:none; cursor:crosshair;
  }
  .pad-controls{display:flex; flex-direction:column; gap:8px;}
  .btn{
    border:1.5px solid var(--ink); background:var(--card); border-radius:8px;
    padding:7px 13px; font-size:13.5px; font-weight:700; cursor:pointer; color:var(--ink);
  }
  .btn.primary{background:var(--green); border-color:var(--green-dark); color:#fff;}
  .btn.rust{background:var(--rust); border-color:#8a3f18; color:#fff;}
  .btn:disabled{opacity:.45; cursor:default;}

  .stage-nav{display:flex; justify-content:space-between; margin-top:16px;}

  /* ---------- Word family builder ---------- */
  .builder-card{
    background:var(--card); border:1px solid var(--paper-line); border-radius:var(--radius);
    padding:22px 24px;
  }
  .builder-head{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:6px;}
  .builder-head h2{margin:0; color:var(--green-dark);}
  .form-row{
    display:grid; grid-template-columns:110px 1fr auto; gap:10px; align-items:center;
    padding:10px 0; border-bottom:1px solid var(--paper-line);
  }
  .form-row label{font-weight:700; color:var(--ink-soft); font-size:14px;}
  .form-row input{
    padding:8px 10px; border:1.5px solid var(--paper-line); border-radius:8px;
    font-family:inherit; font-size:15px; width:100%;
  }
  .reveal-word{font-size:13px; color:var(--ink-soft); background:var(--gold-tint); padding:4px 8px; border-radius:6px; display:none;}
  .reveal-word.show{display:inline-block;}

  /* ---------- Flashcards ---------- */
  .flash-wrap{display:flex; flex-direction:column; align-items:center; gap:18px;}
  .flash-progress{font-size:13.5px; color:var(--ink-soft);}
  .flashcard{
    width:min(480px,90vw); height:280px; perspective:1200px; cursor:pointer;
  }
  .flashcard-inner{
    position:relative; width:100%; height:100%; transition:transform .5s;
    transform-style:preserve-3d;
  }
  .flashcard.flipped .flashcard-inner{transform:rotateY(180deg);}
  .flash-face{
    position:absolute; inset:0; backface-visibility:hidden;
    border-radius:16px; border:1.5px solid var(--ink);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    padding:24px; text-align:center; background:var(--card);
  }
  .flash-face.front{ }
  .flash-face.back{ transform:rotateY(180deg); background:var(--green-tint); }
  .flash-face .big-word{font-size:32px; font-weight:700; color:var(--green-dark);}
  .flash-face #playAudio{margin-top:12px;}
  .flash-face .hint{font-size:13px; color:var(--ink-soft); margin-top:10px;}
  .flash-face .back-def{font-size:19px; margin-bottom:12px;}
  .rate-row{display:flex; gap:10px;}

  /* ---------- Match It ---------- */
  .match-grid{display:grid; grid-template-columns:1fr 1fr; gap:22px;}
  @media (max-width:600px){ .match-grid{grid-template-columns:1fr;} }
  .match-col h3{margin:0 0 10px; font-size:14px; text-transform:uppercase; letter-spacing:.5px; color:var(--ink-soft);}
  .match-item{
    display:block; width:100%; text-align:left; margin-bottom:8px;
    padding:11px 13px; border-radius:10px; border:1.5px solid var(--paper-line);
    background:var(--card); font-size:15px; cursor:pointer;
  }
  .match-item.selected{border-color:var(--green); background:var(--green-tint);}
  .match-item.correct{border-color:var(--gold); background:var(--gold-tint); cursor:default;}
  .match-item.wrong{border-color:var(--rust); background:var(--rust-tint);}
  .match-item:disabled{cursor:default;}
  .match-status{margin-top:14px; font-size:14.5px; color:var(--ink-soft);}

  /* ---------- Quiz ---------- */
  .quiz-card{background:var(--card); border:1px solid var(--paper-line); border-radius:var(--radius); padding:24px; max-width:640px; margin:0 auto;}
  .quiz-q{font-size:19px; margin-bottom:18px;}
  .quiz-opt{
    display:block; width:100%; text-align:left; padding:12px 14px; margin-bottom:9px;
    border-radius:10px; border:1.5px solid var(--paper-line); background:#fff; font-size:15px; cursor:pointer;
  }
  .quiz-opt:hover{border-color:var(--green);}
  .quiz-opt.correct{background:var(--gold-tint); border-color:var(--gold);}
  .quiz-opt.wrong{background:var(--rust-tint); border-color:var(--rust);}
  .quiz-opt:disabled{cursor:default;}
  .quiz-score{font-size:14px; color:var(--ink-soft); margin-bottom:10px;}
  .quiz-foot{display:flex; justify-content:space-between; align-items:center; margin-top:16px;}

  .setup-row{display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:18px;}
  .setup-row select{
    padding:8px 10px; border-radius:8px; border:1.5px solid var(--paper-line); font-family:inherit; font-size:14.5px;
  }
  .center-note{color:var(--ink-soft); font-size:14.5px; text-align:center; padding:40px 20px;}
</style>
</head>
<body>
<div class="app">
  <div class="masthead">
    <h1>English 10-1 Vocabulary</h1>
    <div class="tag" id="tagLine">A vocabulary field guide — five ways to study each list.</div>
  </div>

  <div class="drawer list-drawer" id="listTabs"></div>
  <div class="drawer" id="modeTabs"></div>

  <div id="stageRoot"></div>
</div>

const LIST_META = {"1": "List 1", "2": "List 2", "3": "List 3", "4": "List 4", "5": "List 5", "6": "List 6", "7": "List 7"};
let currentListId = "1";
let WORDS = WORD_LISTS[currentListId];

const POS_LABEL = {
  noun:'noun', verb:'verb', adjective:'adj.', adverb:'adv.', 'verb/adj':'verb / adj.'
};

let state = {
  mode: 'specimen',
  currentIndex: 0,
  search: '',
  posFilter: null,
  flash: { deck: [], i: 0, flipped: false, known: 0, learning: 0, done:false },
  match: { pool: [], leftOrder: [], rightOrder: [], selectedLeft:null, matched:new Set(), wrong:null, mode:'definition' },
  quiz: { pool: [], i:0, score:0, mode:'def2word', answered:false, options:[], correctIdx:null, chosenIdx:null, count:10, finished:false }
};

const sketches = {}; // wordNum -> dataURL

function switchList(id){
  if(id === currentListId) return;
  currentListId = id;
  WORDS = WORD_LISTS[id];
  state.currentIndex = WORDS[0].num;
  state.search = '';
  state.posFilter = null;
  state.flash = { deck: [], i: 0, flipped: false, known: 0, learning: 0, done:false };
  state.match = { pool: [], leftOrder: [], rightOrder: [], selectedLeft:null, matched:new Set(), wrong:null, mode:'definition' };
  state.quiz = { pool: [], i:0, score:0, mode:'def2word', answered:false, options:[], correctIdx:null, chosenIdx:null, count:10, finished:false };
  if(state.mode==='flash') setupFlash();
  if(state.mode==='match') setupMatch();
}

function renderListTabs(){
  const el = document.getElementById('listTabs');
  el.innerHTML =
    '<span class="drawer-label">List:</span>' +
    Object.keys(WORD_LISTS).map(id=>
      `<button data-list="${id}" class="${currentListId===id?'active':''}">${LIST_META[id]} <span style="opacity:.75;font-weight:400;">(${WORD_LISTS[id].length})</span></button>`
    ).join('');
  Array.from(el.querySelectorAll('button')).forEach(btn=>{
    btn.addEventListener('click', ()=>{
      switchList(btn.dataset.list);
      render();
    });
  });
  const tag = document.getElementById('tagLine');
  if(tag) tag.textContent = `${LIST_META[currentListId]} — ${WORDS.length} words — five ways to study each one.`;
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function filteredWords(){
  return WORDS.filter(w=>{
    const matchesSearch = !state.search || w.word.toLowerCase().includes(state.search.toLowerCase());
    const matchesPos = !state.posFilter || w.pos === state.posFilter;
    return matchesSearch && matchesPos;
  });
}

/* ---------------- Mode tabs ---------------- */
const MODES = [
  {id:'specimen', label:'Specimen Card'},
  {id:'family', label:'Word Family'},
  {id:'flash', label:'Flashcards'},
  {id:'match', label:'Match It'},
  {id:'quiz', label:'Quiz Me'}
];

function renderTabs(){
  const el = document.getElementById('modeTabs');
  el.innerHTML = MODES.map(m=>`<button data-mode="${m.id}" class="${state.mode===m.id?'active':''}">${m.label}</button>`).join('');
  Array.from(el.querySelectorAll('button')).forEach(btn=>{
    btn.addEventListener('click', ()=>{
      state.mode = btn.dataset.mode;
      if(state.mode==='flash') setupFlash();
      if(state.mode==='match') setupMatch();
      if(state.mode==='quiz' && state.quiz.pool.length===0) {} // wait for setup screen
      render();
    });
  });
}

/* ================= SPECIMEN CARD MODE ================= */
function renderSidebar(showList){
  const words = filteredWords();
  return `
  <div class="sidebar">
    <input type="search" placeholder="Search a word..." value="${state.search}" id="searchBox">
    <div class="pos-filter" id="posFilter">
      ${['noun','verb','adjective','adverb','verb/adj'].map(p=>`<span class="pos-chip ${state.posFilter===p?'on':''}" data-pos="${p}">${POS_LABEL[p]}</span>`).join('')}
    </div>
    <ul class="word-list" id="wordListUl">
      ${words.map(w=>`<li><button data-num="${w.num}" class="${w.num===state.currentIndex?'current':''}"><span>${w.word}</span><span class="num">#${String(w.num).padStart(2,'0')}</span></button></li>`).join('')}
    </ul>
  </div>`;
}

function bindSidebar(onPick){
  document.getElementById('searchBox').addEventListener('input', (e)=>{ state.search = e.target.value; render(); });
  Array.from(document.querySelectorAll('#posFilter .pos-chip')).forEach(chip=>{
    chip.addEventListener('click', ()=>{
      const p = chip.dataset.pos;
      state.posFilter = state.posFilter===p ? null : p;
      render();
    });
  });
  Array.from(document.querySelectorAll('#wordListUl button')).forEach(btn=>{
    btn.addEventListener('click', ()=>{ onPick(parseInt(btn.dataset.num)); render(); });
  });
}

function getWordByNum(n){ return WORDS.find(w=>w.num===n) || WORDS[0]; }

    state.currentIndex = list[idx];
    render();
  });
  document.getElementById('nextWord').addEventListener('click', ()=>{
    const list = WORDS.map(x=>x.num);
    let idx = list.indexOf(w.num);
    idx = (idx+1)%list.length;
    state.currentIndex = list[idx];
    render();
  });

  setupCanvas(w.num);
}

function setupCanvas(num){
  const canvas = document.getElementById('sketchPad');
  const ctx = canvas.getContext('2d');
  ctx.lineWidth = 2.4;
  ctx.lineCap = 'round';
  ctx.strokeStyle = '#26443A';
  if(sketches[num]){
    const img = new Image();
    img.onload = ()=> ctx.drawImage(img,0,0);
    img.src = sketches[num];
  }
  let drawing = false;
  function pos(e){
    const rect = canvas.getBoundingClientRect();
    const cx = (e.touches? e.touches[0].clientX : e.clientX) - rect.left;
    const cy = (e.touches? e.touches[0].clientY : e.clientY) - rect.top;
    return [cx,cy];
  }
  function start(e){ drawing=true; const [x,y]=pos(e); ctx.beginPath(); ctx.moveTo(x,y); e.preventDefault(); }
  function move(e){ if(!drawing) return; const [x,y]=pos(e); ctx.lineTo(x,y); ctx.stroke(); e.preventDefault(); }
  function end(){ if(drawing){ drawing=false; sketches[num] = canvas.toDataURL(); } }
  canvas.addEventListener('mousedown', start);
  canvas.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, {passive:false});
  canvas.addEventListener('touchmove', move, {passive:false});
  canvas.addEventListener('touchend', end);
  document.getElementById('clearPad').addEventListener('click', ()=>{
    ctx.clearRect(0,0,canvas.width,canvas.height);
    delete sketches[num];
  });
}

/* ================= WORD FAMILY BUILDER ================= */
function renderFamilyMode(){
  const w = getWordByNum(state.currentIndex || WORDS[0].num);
  const forms = w.forms;
  const rows = [
    ['Noun', forms.noun],
    ['Verb', forms.verb],
    ['Adjective', forms.adjective],
    ['Adverb', forms.adverb],
  ];
  const html = `
  <div class="layout">
    ${renderSidebar()}
    <div class="stage">
      <div class="builder-card">
        <div class="builder-head">
          <h2>${w.word}</h2>
          <span class="pos-badge" style="background:var(--green);color:#fff;">${POS_LABEL[w.pos]||w.pos}</span>
        </div>
        <p style="color:var(--ink-soft);margin-top:0;">Write one sentence for each word form. Pick your favorite form if a row shows more than one word.</p>
        ${rows.map(([label,form],i)=>`
          <div class="form-row">
            <label>${label}</label>
            <input type="text" placeholder="Write a sentence using ${label.toLowerCase()==='noun'? 'the noun form' : 'the '+label.toLowerCase()+' form'}..." data-form-idx="${i}">
            <div>
              <button class="btn" data-reveal="${i}">Show word</button>
              <span class="reveal-word" id="reveal-${i}">${form||'—'}</span>
            </div>
          </div>
        `).join('')}
      </div>
      <div class="stage-nav">
        <button class="btn" id="prevWord">&larr; Previous</button>
        <button class="btn" id="nextWord">Next &rarr;</button>
      </div>
    </div>
  </div>`;
  document.getElementById('stageRoot').innerHTML = html;
  bindSidebar((n)=>{ state.currentIndex = n; });
  Array.from(document.querySelectorAll('[data-reveal]')).forEach(btn=>{
    btn.addEventListener('click', ()=>{
      document.getElementById('reveal-'+btn.dataset.reveal).classList.add('show');
    });
  });
  const list = WORDS.map(x=>x.num);
  document.getElementById('prevWord').addEventListener('click', ()=>{
    let idx = list.indexOf(w.num); idx=(idx-1+list.length)%list.length; state.currentIndex=list[idx]; render();
  });
  document.getElementById('nextWord').addEventListener('click', ()=>{
    let idx = list.indexOf(w.num); idx=(idx+1)%list.length; state.currentIndex=list[idx]; render();
  });
}

/* ================= FLASHCARDS ================= */
function speakWord(text){
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US';
  u.rate = 0.85;
  window.speechSynthesis.speak(u);
}
function setupFlash(){
  const pool = filteredWords().length>=4 ? filteredWords() : WORDS;
  state.flash = { deck: shuffle(pool), i:0, flipped:false, known:0, learning:0, done:false };
}
function renderFlashMode(){
  if(state.flash.deck.length===0) setupFlash();
  const f = state.flash;
  if(f.done){
    document.getElementById('stageRoot').innerHTML = `
      <div class="flash-wrap">
        <div class="specimen" style="max-width:480px;width:100%;">
          <div class="specimen-body" style="text-align:center;">
            <h2 style="color:var(--green-dark);">Deck complete</h2>
            <p>Known: <strong>${f.known}</strong> &nbsp; Still learning: <strong>${f.learning}</strong></p>
            <button class="btn primary" id="restartFlash">Shuffle again</button>
          </div>
        </div>
      </div>`;
    document.getElementById('restartFlash').addEventListener('click', ()=>{ setupFlash(); render(); });
    return;
  }
  const w = f.deck[f.i];
  document.getElementById('stageRoot').innerHTML = `
    <div class="flash-wrap">
      <div class="flash-progress">Card ${f.i+1} of ${f.deck.length} &nbsp;·&nbsp; Known ${f.known} &nbsp;·&nbsp; Learning ${f.learning}</div>
      <div class="flashcard ${f.flipped?'flipped':''}" id="flashcard">
        <div class="flashcard-inner">
          <div class="flash-face front">
            <div class="big-word">${w.word}</div>
            <button class="btn" id="playAudio" title="Hear the word">&#128264; Hear it</button>
            <div class="hint">${POS_LABEL[w.pos]||w.pos} — tap to reveal meaning</div>
          </div>
          <div class="flash-face back">
            <div class="back-def">${w.definition}</div>
            <div class="hint">synonyms: ${w.synonyms.slice(0,3).join(', ')||'—'}</div>
          </div>
        </div>
      </div>
      <div class="rate-row" style="${f.flipped? '' : 'visibility:hidden'}">
        <button class="btn rust" id="rateLearning">Still learning</button>
        <button class="btn primary" id="rateKnown">I know this</button>
      </div>
    </div>`;
  document.getElementById('flashcard').addEventListener('click', ()=>{
    f.flipped = !f.flipped; render();
  });
  const playBtn = document.getElementById('playAudio');
  if(playBtn) playBtn.addEventListener('click', (e)=>{ e.stopPropagation(); speakWord(w.word); });
  if(!f.flipped) speakWord(w.word);
  const nextCard = ()=>{
    f.i++; f.flipped=false;
    if(f.i>=f.deck.length) f.done=true;
    render();
  };
  const known = document.getElementById('rateKnown');
  const learning = document.getElementById('rateLearning');
  if(known) known.addEventListener('click',(e)=>{ e.stopPropagation(); f.known++; nextCard(); });
  if(learning) learning.addEventListener('click',(e)=>{ e.stopPropagation(); f.learning++; nextCard(); });
}

/* ================= MATCH IT ================= */
function setupMatch(){
  const pool = shuffle(filteredWords().length>=6 ? filteredWords() : WORDS).slice(0,6);
  state.match = {
    pool,
    leftOrder: shuffle(pool),
    rightOrder: shuffle(pool),
    selectedLeft: null,
    matched: new Set(),
    wrong: null
  };
}
function renderMatchMode(){
  if(state.match.pool.length===0) setupMatch();
  const m = state.match;
  const allMatched = m.matched.size === m.pool.length;
  document.getElementById('stageRoot').innerHTML = `
    <div class="specimen" style="padding:22px 24px;">
      <p style="color:var(--ink-soft);margin-top:0;">Click a word on the left, then click its definition on the right.</p>
      <div class="match-grid">
        <div class="match-col">
          <h3>Words</h3>
          ${m.leftOrder.map(w=>`<button class="match-item ${m.selectedLeft===w.num?'selected':''} ${m.matched.has(w.num)?'correct':''}" data-num="${w.num}" data-side="left" ${m.matched.has(w.num)?'disabled':''}>${w.word}</button>`).join('')}
        </div>
        <div class="match-col">
          <h3>Definitions</h3>
          ${m.rightOrder.map(w=>`<button class="match-item ${m.matched.has(w.num)?'correct':''} ${m.wrong===w.num?'wrong':''}" data-num="${w.num}" data-side="right" ${m.matched.has(w.num)?'disabled':''}>${w.definition}</button>`).join('')}
        </div>
      </div>
      <div class="match-status">${allMatched? 'All matched — nice work.' : `${m.matched.size} of ${m.pool.length} matched`}</div>
      ${allMatched? '<button class="btn primary" id="newMatchRound" style="margin-top:10px;">New round</button>' : ''}
    </div>`;
  Array.from(document.querySelectorAll('.match-item[data-side="left"]')).forEach(btn=>{
    btn.addEventListener('click', ()=>{
      m.selectedLeft = parseInt(btn.dataset.num);
      m.wrong = null;
      render();
    });
  });
  Array.from(document.querySelectorAll('.match-item[data-side="right"]')).forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const num = parseInt(btn.dataset.num);
      if(m.selectedLeft===null) return;
      if(m.selectedLeft===num){
        m.matched.add(num);
        m.selectedLeft = null;
        m.wrong = null;
      } else {
        m.wrong = num;
        setTimeout(()=>{ m.wrong=null; render(); }, 550);
      }
      render();
    });
  });
  const again = document.getElementById('newMatchRound');
  if(again) again.addEventListener('click', ()=>{ setupMatch(); render(); });
}

/* ================= QUIZ ME ================= */
function buildQuiz(count){
  const pool = shuffle(filteredWords().length>=4 ? filteredWords() : WORDS).slice(0, Math.min(count, filteredWords().length || WORDS.length));
  state.quiz = { pool, i:0, score:0, answered:false, options:[], correctIdx:null, chosenIdx:null, count, finished:false };
  buildQuizQuestion();
}
function buildQuizQuestion(){
  const q = state.quiz;
  const w = q.pool[q.i];
  const distractors = shuffle(WORDS.filter(x=>x.num!==w.num)).slice(0,3);
  const options = shuffle([w, ...distractors]);
  q.options = options.map(o=>o.definition);
  q.correctIdx = options.findIndex(o=>o.num===w.num);
  q.answered = false;
  q.chosenIdx = null;
}
function renderQuizMode(){
  const q = state.quiz;
  if(q.pool.length===0){
    document.getElementById('stageRoot').innerHTML = `
      <div class="quiz-card">
        <h2 style="margin-top:0;color:var(--green-dark);">Quiz Me</h2>
        <p style="color:var(--ink-soft);">Choose how many questions. Each question shows a word — pick its correct definition.</p>
        <div class="setup-row">
          <label>Questions:</label>
          <select id="quizCount">
            ${(()=>{
              const n = WORDS.length;
              const opts = new Set();
              if(n>=5) opts.add(5);
              if(n>=10) opts.add(10);
              opts.add(n);
              return Array.from(opts).sort((a,b)=>a-b).map(v=>`<option value="${v}">${v===n? 'All '+n : v}</option>`).join('');
            })()}
          </select>
          <button class="btn primary" id="startQuiz">Start quiz</button>
        </div>
        <p style="font-size:13.5px;color:var(--ink-soft);">Tip: use the Specimen Card search/filter first to quiz just one part of speech or a subset of this list.</p>
      </div>`;
    document.getElementById('startQuiz').addEventListener('click', ()=>{
      const count = parseInt(document.getElementById('quizCount').value);
      buildQuiz(count);
      render();
    });
    return;
  }
  if(q.finished){
    document.getElementById('stageRoot').innerHTML = `
      <div class="quiz-card" style="text-align:center;">
        <h2 style="color:var(--green-dark);">Quiz complete</h2>
        <p style="font-size:20px;">Score: <strong>${q.score} / ${q.pool.length}</strong></p>
        <button class="btn primary" id="retakeQuiz">New quiz</button>
      </div>`;
    document.getElementById('retakeQuiz').addEventListener('click', ()=>{
      state.quiz = { pool:[], i:0, score:0, answered:false, options:[], correctIdx:null, chosenIdx:null, count:10, finished:false };
      render();
    });
    return;
  }
  const w = q.pool[q.i];
  document.getElementById('stageRoot').innerHTML = `
    <div class="quiz-card">
      <div class="quiz-score">Question ${q.i+1} of ${q.pool.length} &nbsp;·&nbsp; Score ${q.score}</div>
      <div class="quiz-q">Which definition matches <strong>"${w.word}"</strong>?</div>
      ${q.options.map((opt,i)=>`<button class="quiz-opt ${q.answered && i===q.correctIdx? 'correct':''} ${q.answered && i===q.chosenIdx && i!==q.correctIdx? 'wrong':''}" data-i="${i}" ${q.answered?'disabled':''}>${opt}</button>`).join('')}
      <div class="quiz-foot">
        <span style="font-size:13.5px;color:var(--ink-soft);">${q.answered? (q.chosenIdx===q.correctIdx? 'Correct.' : 'Not quite — the right answer is highlighted.') : ''}</span>
        <button class="btn primary" id="quizNext" ${q.answered? '' : 'disabled'}>${q.i+1===q.pool.length? 'Finish' : 'Next'}</button>
      </div>
    </div>`;
  Array.from(document.querySelectorAll('.quiz-opt')).forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(q.answered) return;
      q.answered = true;
      q.chosenIdx = parseInt(btn.dataset.i);
      if(q.chosenIdx===q.correctIdx) q.score++;
      render();
    });
  });
  document.getElementById('quizNext').addEventListener('click', ()=>{
    if(q.i+1 >= q.pool.length){ q.finished = true; }
    else { q.i++; buildQuizQuestion(); }
    render();
  });
}

/* ================= RENDER ROOT ================= */
function render(){
  renderListTabs();
  renderTabs();
  if(!state.currentIndex) state.currentIndex = WORDS[0].num;
  if(state.mode==='specimen') renderSpecimenMode();
  else if(state.mode==='family') renderFamilyMode();
  else if(state.mode==='flash') renderFlashMode();
  else if(state.mode==='match') renderMatchMode();
  else if(state.mode==='quiz') renderQuizMode();
}

render();
</script>
